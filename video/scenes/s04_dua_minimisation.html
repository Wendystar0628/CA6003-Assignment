<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 04 · Data governance</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit/tokens.css">
<script src="../kit/kit.js"></script>
</head>
<body>
<script>
/* Scene 04 · Data governance · docs/video_plan.md §7.1–7.2 scene 04.
   Speaker: member 0. One relation: after the data use agreement check, only 78 of the 175 source columns
   were kept (the other 97 dim to 25 %, M3, while the count runs 175 -> 78, M10). Hash-verified files and
   hash-locked hypotheses follow as two ink lines. The 175 squares are the real per-file column counts
   (video/data/minimisation.json, groups.per_file), file by file, kept columns first. Ink only. */

const CUES = {
  dua: 'data use agreement',     // DUA line
  check: 'did neither',          // ink check (supported)
  grid: 'We kept',               // 175 squares appear
  keep: '78',                    // 97 squares dim (M3), count 175 -> 78 (M10)
  of: 'of 175',                  // "of 175 columns" label
  files: 'verified every',       // fingerprint line 1
  locks: 'locked our',           // fingerprint line 2
};

const GRID = { cols: 25, cell: 24, gap: 8, x0: 48, y0: 132 };

/** Fingerprint icon (ink line art, 40x40 box). */
function fingerprint(parent, x, y, size) {
  const g = Kit.svg('g', { transform: `translate(${x},${y}) scale(${size / 40})`, fill: 'none', stroke: Kit.C.ink, 'stroke-width': 2.2, 'stroke-linecap': 'round' }, parent);
  g.innerHTML = '<path d="M7 17c0-8 6-13 13-13s13 5 13 13"/><path d="M12 17c0-5 3.5-8.5 8-8.5s8 3.5 8 8.5v3"/><path d="M17 18c0-2 1.3-3.5 3-3.5s3 1.5 3 3.5v6c0 4-2 7-4 9"/><path d="M12 22v4c0 4-1 7-3 9"/><path d="M28 22v6c0 3-1 6-2.5 8"/><path d="M7 21v3"/><path d="M33 21v3"/>';
  return g;
}

Kit.createScene({
  number: 4,
  name: 'dua_minimisation',
  title: 'Data governance',
  subtitle: 'Data use agreement, column minimisation, hash-verified files and locked hypotheses',
  pointer: '1.8–1.9',
  data: '../data/minimisation.json',
  cues: CUES,

  setup(ctx) {
    const { fig, data } = ctx, K = Kit;
    const S = ctx.S = {};
    const g = K.svg('g', {}, fig);
    S.raw = K.val(data, 'raw'); S.kept = K.val(data, 'kept');

    // 1. data use agreement, with an ink check
    S.dua = K.text(g, { x: 116, y: 70, text: 'NCHS data use agreement: no re-identification · no linkage', cls: 'kit-t-note' });
    S.check = K.feedback(g, { kind: 'supported', x: 48, y: 30, size: 48 });

    // 2. 175 squares, file by file, kept columns first (real per-file counts)
    const order = [];
    data.groups.per_file.forEach((f) => { for (let i = 0; i < f.raw; i++) order.push(i < f.kept); });
    if (order.length !== S.raw) throw new Error('per-file counts do not add up to the raw column count');
    S.sq = order.map((isKept, k) => {
      const col = k % GRID.cols, row = Math.floor(k / GRID.cols);
      const r = K.svg('rect', { x: GRID.x0 + col * (GRID.cell + GRID.gap), y: GRID.y0 + row * (GRID.cell + GRID.gap), width: GRID.cell, height: GRID.cell, fill: K.C.ink }, g);
      return { r, kept: isKept };
    });
    S.count = K.callout(g, { x: 900, y: 270, size: 'main' });
    S.countLab = K.text(g, { x: 900, y: 352, text: 'of ' + K.disp(data, 'raw') + ' columns kept', cls: 'kit-t-note' });

    // 3. hash-verified files, hash-locked hypotheses
    S.fp1 = K.svg('g', {}, g);
    fingerprint(S.fp1, 48, 404, 60);
    K.text(S.fp1, { x: 132, y: 446, text: K.disp(data, 'files_verified') + ' raw files: hash-verified (SHA-256)', cls: 'kit-t-note' });
    S.fp2 = K.svg('g', {}, g);
    fingerprint(S.fp2, 48, 500, 60);
    K.text(S.fp2, { x: 132, y: 542, text: 'Hypotheses: locked by hash before any results', cls: 'kit-t-note' });
  },

  render(t, ctx) {
    const K = Kit, S = ctx.S, c = ctx.cues;
    K.op(S.dua, K.appear(t, c.dua));
    S.check.update(K.appear(t, c.check));
    const a = K.appear(t, c.grid), foc = K.M3_focus(t, c.keep);
    S.sq.forEach((q) => K.op(q.r, a * (q.kept ? 1 : foc.others)));
    const n = K.M10_count(t, c.keep, S.raw, S.kept);
    S.count.update({ text: K.fmt(n, 0), number: K.appear(t, c.grid) });
    K.op(S.countLab, K.appear(t, c.of));
    K.op(S.fp1, K.appear(t, c.files));
    K.op(S.fp2, K.appear(t, c.locks));
  },
});
</script>
</body>
</html>
