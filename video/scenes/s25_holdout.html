<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 25 · Hold-out and post-audit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit/tokens.css">
<script src="../kit/kit.js"></script>
<script src="_d_common.js"></script>
</head>
<body>
<script>
/* Scene 25 · Hold-out and post-audit (secondary diagram "hold-out timeline", §7 last paragraph) · docs/video_plan.md §4 scene 25.
   Speaker D presents B's checks. One relation: the pattern held on an internal hold-out of 1,146 adults scored once,
   and six external-review issues changed no locked verdict. Not shown: the hold-out gap (+0.060); only 25 Screening-group positives are in it.
   Numbers: video/data/holdout.json. */

// Cues in scene seconds, estimated at ~143 wpm; replace with the marks on D's take (§8.3 step 5).
const CUES = {
  axis: 0.2,      // "B's checks agree:"                                  M1: the time line
  n1: 0.7,        // (the three steps come in order)                      hypotheses locked (SHA-256)
  n2: 1.3,        //                                                      experiments frozen
  n3: 1.9,        // "an internal hold-out"                               hold-out: scored once
  dots: 3.0,      // "of 1,146 adults,"                                   1,146 dots as one block, number
  tag: 3.9,       // "scored once, kept the pattern;"                      "internal check, not independent"
  led1: 6.2,      // "six issues raised by an external review"            ledger row 1
  led1ok: 8.4,    //                                                      check
  led2: 9.2,      // "changed no locked verdict."                         ledger row 2 + check
  small: 11.2,    // (pause)                                              screen-only caveat: 25 Screening-group positives
  title: 3.4,     // title settles on the screen text
};

Kit.createScene({
  number: 25,
  name: 'holdout',
  duration: 13,
  layout: 'R',
  speaker: 'D',
  title: [{ at: 0, text: 'Do the checks agree?' }, { at: CUES.title, text: '(set from data)' }],
  attribution: 'checks: B · §9',
  source: '§9 · S9_holdout_vs_cv',
  data: '../data/holdout.json',
  cues: CUES,

  setup(ctx) {
    const { fig, data } = ctx, K = Kit, S = ctx.S = {};
    const n = K.item(data, 'n');
    DC.setTitle(ctx, 1, 'Hold-out ' + n.display + ' · internal check');
    const g = K.svg('g', {}, fig);

    // ---- time line: three steps, lit in order (ink only: no semantic colour)
    const labels = data.groups.timeline;
    const xs = [230, 610, 990], yT = 110;
    S.line = K.svg('line', { x1: 80, x2: 1150, y1: yT, y2: yT, stroke: K.C.ink, 'stroke-width': 2.5, 'stroke-dasharray': '1070 1070' }, g);
    S.nodes = labels.map((lab, i) => {
      const gg = K.svg('g', {}, g);
      const ring = K.svg('circle', { cx: xs[i], cy: yT, r: 15, fill: K.C.ink, stroke: K.C.ink, 'stroke-width': 3 }, gg);
      const tx = K.text(gg, { x: xs[i], y: yT + 62, text: lab, anchor: 'middle', cls: 'kit-t-min' });
      return { g: gg };
    });

    // ---- 1,146 dots, one block (50 columns)
    const COLS = 50, R = 4.3, P = 12, x0 = 66, y0 = 330;
    let d = '';
    for (let i = 0; i < n.value; i++) {
      const cx = x0 + (i % COLS) * P, cy = y0 + Math.floor(i / COLS) * P;
      d += `M${(cx - R).toFixed(1)} ${cy.toFixed(1)}a${R} ${R} 0 1 0 ${2 * R} 0a${R} ${R} 0 1 0 ${-2 * R} 0Z`;
    }
    S.dots = K.svg('g', {}, g);
    K.svg('path', { d, fill: K.C.ink }, S.dots);
    S.nNum = K.callout(g, { x: 60, y: 292, size: 'second', label: 'hold-out adults' });
    S.nNum.label.setAttribute('x', 290); S.nNum.label.setAttribute('y', 292);
    S.tag = DC.halo(K.text(g, { x: 60, y: 650, text: 'internal check, not independent', cls: 'kit-t-min' }));

    // ---- ledger: external review issues, verdicts unchanged
    S.led = [0, 1].map((i) => K.svg('g', {}, g));
    const six = K.item(data, 'postaudit_n');
    K.text(S.led[0], { x: 770, y: 372, text: six.display + ' issues from an external', cls: 'kit-t-min' });
    K.text(S.led[0], { x: 770, y: 412, text: 'review · checked', cls: 'kit-t-min' });
    K.text(S.led[1], { x: 770, y: 532, text: 'no locked verdict changed', cls: 'kit-t-min' });
    S.ok = [K.feedback(S.led[0], { kind: 'supported', x: 700, y: 340, size: 48 }), K.feedback(S.led[1], { kind: 'supported', x: 700, y: 496, size: 48 })];

    // ---- screen-only caveat: Screening group has only 25 positives in the hold-out
    S.small = K.svg('g', {}, g);
    K.svg('rect', { x: 61.5, y: 685.5, width: 21, height: 21, fill: '#fff', stroke: K.C.screen, 'stroke-width': 3 }, S.small);
    K.text(S.small, { x: 98, y: 706, text: K.item(data, 'pos_screen').label.replace('Screening-group positives', 'Screening group') + ': ' + K.disp(data, 'pos_screen') + ' positives', cls: 'kit-t-min' });
  },

  render(t, ctx) {
    const K = Kit, S = ctx.S, c = ctx.cues, data = ctx.data;
    const p = K.progress(t, c.axis, 0.6, K.ease.enter);
    S.line.setAttribute('stroke-dashoffset', 1070 * (1 - p)); K.op(S.line, p > 0 ? 1 : 0);
    [c.n1, c.n2, c.n3].forEach((at, i) => K.op(S.nodes[i].g, K.appear(t, at)));
    K.op(S.dots, K.appear(t, c.dots));
    S.nNum.update({ text: K.disp(data, 'n'), number: K.appear(t, c.dots), label: K.appear(t, c.dots) });
    K.op(S.tag, K.appear(t, c.tag));
    K.op(S.led[0], K.appear(t, c.led1)); K.op(S.led[1], K.appear(t, c.led2));
    S.ok[0].update(K.appear(t, c.led1ok)); S.ok[1].update(K.appear(t, c.led2));
    K.op(S.small, K.appear(t, c.small));
  },
});
</script>
</body>
</html>
