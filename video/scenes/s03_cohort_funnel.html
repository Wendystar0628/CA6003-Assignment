<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 03 · Cohort and label definition</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit/tokens.css">
<script src="../kit/kit.js"></script>
</head>
<body>
<script>
/* Scene 03 · Cohort and label definition · docs/video_plan.md §7.1–7.2 scene 03.
   Speaker: member 0. One relation: 11,933 NHANES participants narrow (M5) to the 5,730 "All adults"
   the project studies; the label is self-report OR HbA1c >= 6.5 % (two sets merge, M6, areas ∝ n);
   survey-weighted, 14.0 % are positive. The three middle funnel levels carry text labels only.
   Grey is introduced here (legend moment): the last bar is the reference population, solid grey + circle.
   Every number comes from video/data/funnel.json. */

const CUES = {
  top: 'The data:',                              // top bar (M2, ink outline)
  funnel: 'NHANES 2021',                          // M5, four levels (0.5 s + 0.4 s still)
  fill: 'Our cohort',                             // last bar solid grey + circle
  num: '5,730',                                 // number when spoken
  def: 'The label is',                            // definition line
  pos1: 'self-reported diagnosis',                // first set
  pos2: ['or HbA1c', 0.0],                        // second set
  merge: 'or more',                               // sets merge into "positive" (M6)
  weighted: '14.0',                               // 14.0 % callout, interval 0.3 s later
};

const BAR = { x0: 470, maxW: 640, h: 40, cy: [52, 116, 180, 244, 308] };
const DEF = { y: 412, cy: 530, rS: 64, xS: 250, xA0: 510, gap: 92 };

Kit.createScene({
  number: 3,
  name: 'cohort_funnel',
  title: 'Cohort and label definition',
  subtitle: 'NHANES 2021–23 (CDC): from participants to the analysis cohort',
  pointer: '1.1, 3.2',
  grid: false,
  legendMoment: { key: 'reference', at: 7.4 },     // legend chip after "5,730 ... adults" (2.5 s, then folds into the footer)
  data: '../data/funnel.json',
  cues: CUES,

  setup(ctx) {
    const { fig, data } = ctx, K = Kit;
    const S = ctx.S = {};
    const g = K.svg('g', {}, fig);

    // ---- funnel rows (ink outline bars; widths from the stored counts). Middle levels: text only.
    const stages = data.groups.stages, nMax = K.val(data, stages[0].item);
    S.rows = stages.map((st, i) => {
      const it = K.item(data, st.item), cy = BAR.cy[i], last = i === stages.length - 1, first = i === 0;
      const w = it.value / nMax * BAR.maxW;
      const row = { w, cy, last };
      row.ghost = K.svg('rect', { fill: 'none', stroke: K.C.ink, 'stroke-width': 2, 'stroke-dasharray': '7 5', y: cy - BAR.h / 2, height: BAR.h }, g);
      row.bar = K.svg('rect', { fill: '#fff', stroke: K.C.ink, 'stroke-width': 2.5, y: cy - BAR.h / 2, height: BAR.h }, g);
      row.grey = last ? K.svg('rect', { x: BAR.x0, y: cy - BAR.h / 2, width: w, height: BAR.h, fill: K.C.reference }, g) : null;
      const text = first ? st.long_label : last ? it.label : st.long_label;
      row.label = K.text(g, { x: BAR.x0 - 24, y: cy + 10, text, cls: last ? 'kit-t-note' : 'kit-t-min', anchor: 'end', weight: last ? 600 : null });
      if (first) row.num = K.text(g, { x: BAR.x0 + w + 20, y: cy + 10, text: it.display, cls: 'kit-t-tick' });
      if (last) {
        row.marker = K.svg('circle', { cx: BAR.x0 - 24 - K.textWidth(row.label) - 22, cy, r: 11, fill: K.C.reference }, g);
        row.num = K.callout(g, { x: BAR.x0 + w + 24, y: cy + 20, size: 'second' });
      }
      return row;
    });

    // ---- label definition: line, then two sets that merge (areas ∝ n)
    const nSelf = K.val(data, 'pos_self'), nA1c = K.val(data, 'pos_a1c'), cut = K.disp(data, 'a1c_cut');
    S.defLine = K.svg('g', {}, g);
    const dl = K.text(S.defLine, { x: 48, y: DEF.y, text: '', cls: 'kit-t-note' });
    [['Label: ', null], ['positive', 600], [' = self-report ', null], ['or', 600], [' HbA1c ≥ ' + cut, null]].forEach(([s, w]) => {
      const sp = K.svg('tspan', { 'font-weight': w }, dl); sp.textContent = s;
    });
    const d = S.def = Object.assign({}, DEF, { rA: K.radiusForArea(nA1c, nSelf, DEF.rS) });
    d.g = K.svg('g', {}, g);
    d.cS = K.svg('circle', { cy: d.cy, r: d.rS, fill: 'none', stroke: K.C.ink, 'stroke-width': 2.5 }, d.g);
    d.cA = K.svg('circle', { cy: d.cy, r: d.rA, fill: 'none', stroke: K.C.ink, 'stroke-width': 2.5 }, d.g);
    d.union = K.svg('path', { fill: 'none', stroke: K.C.ink, 'stroke-width': 5, 'stroke-linejoin': 'round' }, d.g);
    d.lS = K.text(d.g, { x: 0, y: d.cy + 10, text: 'self-report', cls: 'kit-t-min', anchor: 'end' });
    d.lA = K.text(d.g, { x: 0, y: d.cy + 10, text: 'HbA1c ≥ ' + cut, cls: 'kit-t-min' });

    // ---- weighted prevalence with its interval
    const iv = K.interval(data, 'prev_ci');
    S.prev = K.callout(g, { x: 800, y: 520, size: 'second', interval: iv.bracket, label: 'positive, survey-weighted' });
  },

  render(t, ctx) {
    const K = Kit, S = ctx.S, c = ctx.cues, data = ctx.data;
    // funnel: top bar M2, then M5 narrowing; the dropped part becomes an ink ghost fading to 20 %
    const steps = K.M5_funnel(t, c.funnel, 4);
    S.rows.forEach((r, i) => {
      let w, vis, ghostA = 0, gx = 0, gw = 0;
      if (i === 0) { const grow = K.M2_barGrow(t, c.top); w = r.w * grow; vis = grow > 0 ? 1 : 0; }
      else {
        const s = steps[i - 1], prev = S.rows[i - 1].w;
        w = K.lerp(prev, r.w, s.narrow); vis = s.narrow > 0 ? 1 : 0;
        gx = BAR.x0 + w; gw = prev - w; ghostA = s.narrow > 0 ? s.ghost : 0;
      }
      r.bar.setAttribute('x', BAR.x0); r.bar.setAttribute('width', Math.max(0, w)); K.op(r.bar, vis);
      r.ghost.setAttribute('x', gx); r.ghost.setAttribute('width', Math.max(0, gw)); K.op(r.ghost, gw > 0.5 ? ghostA : 0);
      const shown = i === 0 ? K.appear(t, c.top + 0.4) : K.appear(t, c.funnel + (i - 1) * 0.9 + 0.4);
      K.op(r.label, shown);
      if (i === 0) K.op(r.num, shown);
    });
    const last = S.rows[4], gf = K.appear(t, c.fill);
    K.op(last.grey, gf); K.op(last.marker, gf);
    last.num.update({ text: K.disp(data, 'n_cohort'), number: K.appear(t, c.num) });

    // label definition
    K.op(S.defLine, K.appear(t, c.def));
    const d = S.def, m = K.M6_morph(t, c.merge);
    const xA = K.lerp(d.xA0, d.xS + d.gap, m);
    d.cS.setAttribute('cx', d.xS); d.cA.setAttribute('cx', xA);
    d.lS.setAttribute('x', d.xS - d.rS - 14); d.lA.setAttribute('x', xA + d.rA + 14);
    K.op(d.cS, K.appear(t, c.pos1)); K.op(d.lS, K.appear(t, c.pos1));
    K.op(d.cA, K.appear(t, c.pos2)); K.op(d.lA, K.appear(t, c.pos2));
    const dist = xA - d.xS, rS = d.rS, rA = d.rA;
    if (dist < rS + rA - 1) {
      const a = (rS * rS - rA * rA + dist * dist) / (2 * dist), h = Math.sqrt(Math.max(0, rS * rS - a * a));
      const ix = d.xS + a, y0 = d.cy;
      d.union.setAttribute('d', `M${ix} ${y0 - h} A${rS} ${rS} 0 1 0 ${ix} ${y0 + h} A${rA} ${rA} 0 1 0 ${ix} ${y0 - h} Z`);
      K.op(d.union, K.clamp((m - 0.8) / 0.2));
    } else K.op(d.union, 0);

    // 14.0 % callout, interval 0.3 s later
    const a = K.appear(t, c.weighted), b = K.appear(t, c.weighted + K.T.appear);
    S.prev.update({ text: K.disp(data, 'prev_w'), number: a, interval: b, label: b });
  },
});
</script>
</body>
</html>
