<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 06 · Confounding check: insurance gap</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit/tokens.css">
<script src="../kit/kit.js"></script>
</head>
<body>
<script>
/* Scene 06 · Confounding check: insurance gap · docs/video_plan.md §7.1–7.2 scene 06.
   Speaker: member 0, presenting member 2's analysis (credit "Analysis by <Name:2>").
   One relation: the crude insured − uninsured gap in diabetes prevalence (+5.3 pp) falls to +0.7 pp after
   age standardisation (M8, in place; the crude value stays as a faint dashed ghost). The interval is drawn
   as a whisker; "interval includes 0" is the in-figure note and the interval values are a 24 px footnote.
   A small DAG: Age -> Insurance, Age -> Diabetes (solid), Insurance -> Diabetes (dashed, "?").
   Ink only. Numbers: video/data/age_std.json. */

const CUES = {
  axis: 'Correct numbers',                 // M1
  crude: '5.3',                            // bar grows (M2), number appears; whisker 0.7 s later
  nodes: 'than the uninsured',             // Insurance, Diabetes and the dashed "?" edge
  age: 'confounding by age',               // Age node + "confounder"
  arrow1: 'the insured are',               // M11 Age -> Insurance
  arrow2: 'much older',                    // M11 Age -> Diabetes
  std: 'the gap falls',                    // M8: bar shrinks, number counts down, interval changes
  zero: 'its interval',                    // "interval includes 0" + footnote
};

const X = { d0: -4, d1: 10, r0: 100, r1: 700 };
const ROW = { bar: 250, barH: 60, whisk: 360, axis: 420 };

Kit.createScene({
  number: 6,
  name: 'age_confounding',
  title: 'Confounding check: insurance gap',
  subtitle: 'Diabetes prevalence, insured vs uninsured, crude and age-standardised',
  credit: 'Analysis by <Name:2>',
  pointer: '4.5–4.6',
  data: '../data/age_std.json',
  cues: CUES,

  setup(ctx) {
    const { fig, data } = ctx, K = Kit;
    const S = ctx.S = {};
    const g = K.svg('g', {}, fig);
    const crude = S.crude = K.interval(data, 'crude_ci'), std = S.std = K.interval(data, 'std_ci');
    const x = S.x = K.scaleLinear([X.d0, X.d1], [X.r0, X.r1]);

    S.axis = K.axis(g, x, { orient: 'bottom', at: ROW.axis, ticks: [-4, -2, 0, 2, 4, 6, 8, 10], format: (v) => K.fmt(v, 0),
      title: { text: 'gap in percentage points', x: X.r0, y: ROW.axis + 88, cls: 'kit-t-min' } });
    S.zero = K.svg('line', { x1: x(0), x2: x(0), y1: ROW.bar - 22, y2: ROW.axis, stroke: K.C.ink, 'stroke-width': 2 }, g);

    // ghost of the crude value (dashed, faint), drawn first so the live bar covers it
    S.ghost = K.svg('g', {}, g);
    K.svg('rect', { x: x(0), y: ROW.bar, width: x(crude.est) - x(0), height: ROW.barH, fill: 'none', stroke: K.C.ink, 'stroke-width': 2.5, 'stroke-dasharray': '8 6' }, S.ghost);
    S.ghostLab = K.text(g, { x: x(crude.est) + 16, y: ROW.bar + ROW.barH / 2 + 10, text: 'crude', cls: 'kit-t-min' });

    // live bar and whisker (re-drawn from the tweened estimate)
    S.bar = K.bar(g, { scale: x, base: 0, y: ROW.bar, width: ROW.barH, orient: 'h', styles: ['ink'] });
    S.wl = K.svg('line', { y1: ROW.whisk, y2: ROW.whisk, stroke: K.C.ink, 'stroke-width': 3 }, g);
    S.capL = K.svg('line', { y1: ROW.whisk - 9, y2: ROW.whisk + 9, stroke: K.C.ink, 'stroke-width': 3 }, g);
    S.capH = K.svg('line', { y1: ROW.whisk - 9, y2: ROW.whisk + 9, stroke: K.C.ink, 'stroke-width': 3 }, g);
    S.dot = K.svg('circle', { cy: ROW.whisk, r: 10, fill: K.C.ink }, g);
    S.inc0 = K.text(g, { x: x(std.hi) + 24, y: ROW.whisk + 10, text: 'interval includes 0', cls: 'kit-t-min' });

    // number and its label (crude -> age-standardised, swapped in place)
    S.num = K.callout(g, { x: 48, y: 176, size: 'main' });
    S.num.num.style.fontSize = '104px';
    S.lab0 = K.text(g, { x: 48, y: 52, text: 'insured − uninsured · crude', cls: 'kit-t-min' });
    S.lab1 = K.text(g, { x: 48, y: 52, text: 'insured − uninsured · age-standardised', cls: 'kit-t-min' });
    S.foot = K.text(g, { x: 48, y: 604, text: 'Intervals (pp): crude ' + crude.bracket + ' · age-standardised ' + std.bracket, cls: 'kit-t-foot' });

    // DAG
    const node = (cx, cy, w, label) => {
      const n = K.svg('g', {}, g);
      K.svg('rect', { x: cx - w / 2, y: cy - 30, width: w, height: 60, rx: 10, fill: '#fff', stroke: K.C.ink, 'stroke-width': 2.5 }, n);
      K.text(n, { x: cx, y: cy + 12, text: label, cls: 'kit-t-note', anchor: 'middle' });
      return n;
    };
    S.nAge = node(1000, 120, 120, 'Age');
    S.conf = K.text(g, { x: 1076, y: 130, text: 'confounder', cls: 'kit-t-min' });
    S.nIns = node(870, 300, 190, 'Insurance');
    S.nDia = node(1140, 300, 170, 'Diabetes');
    S.a1 = K.arrow(g, { x1: 970, y1: 152, x2: 898, y2: 266 });
    S.a2 = K.arrow(g, { x1: 1030, y1: 152, x2: 1110, y2: 266 });
    S.dash = K.svg('g', {}, g);
    K.svg('line', { x1: 969, x2: 1042, y1: 300, y2: 300, stroke: K.C.ink, 'stroke-width': 3, 'stroke-dasharray': '9 7' }, S.dash);
    K.svg('path', { d: 'M1053 300 L1037 291 L1037 309 Z', fill: K.C.ink }, S.dash);
    K.text(S.dash, { x: 1011, y: 276, text: '?', cls: 'kit-sans', size: 40, weight: 600, anchor: 'middle' });
  },

  render(t, ctx) {
    const K = Kit, S = ctx.S, c = ctx.cues, d = ctx.data, x = S.x;
    S.axis.update(K.M1_axisDraw(t, c.axis, { nTicks: 8 }));
    K.op(S.zero, K.appear(t, c.axis + 0.6));

    const grow = K.M2_barGrow(t, c.crude), m8 = K.M8_valueChange(t, c.std, S.crude.est, S.std.est);
    S.bar.update({ value: m8.length, grow });
    const est = K.lerp(S.crude.est, S.std.est, m8.p), lo = K.lerp(S.crude.lo, S.std.lo, m8.p), hi = K.lerp(S.crude.hi, S.std.hi, m8.p);
    const wA = K.appear(t, c.crude + 0.7);
    S.wl.setAttribute('x1', x(lo)); S.wl.setAttribute('x2', x(hi));
    S.capL.setAttribute('x1', x(lo)); S.capL.setAttribute('x2', x(lo)); S.capH.setAttribute('x1', x(hi)); S.capH.setAttribute('x2', x(hi));
    S.dot.setAttribute('cx', x(est));
    [S.wl, S.capL, S.capH, S.dot].forEach((e) => K.op(e, wA));
    K.op(S.ghost, K.clamp(m8.p * 4) * 0.35);
    K.op(S.ghostLab, K.clamp(m8.p * 4) * 0.6);

    const txt = m8.p <= 0 ? K.disp(d, 'crude') : (m8.p >= 1 ? K.disp(d, 'std') : K.fmt(m8.value, 1, { sign: true }) + ' pp');
    S.num.update({ text: txt, number: K.appear(t, c.crude) });
    K.op(S.lab0, K.appear(t, c.crude) * (1 - K.clamp(m8.fill * 2)));
    K.op(S.lab1, K.clamp(m8.fill * 2 - 1));
    K.op(S.inc0, K.appear(t, c.zero));
    K.op(S.foot, K.appear(t, c.zero + 0.4));

    const a = K.appear(t, c.nodes);
    K.op(S.nIns, a); K.op(S.nDia, a); K.op(S.dash, a);
    K.op(S.nAge, K.appear(t, c.age)); K.op(S.conf, K.appear(t, c.age + 0.3));
    S.a1.update(K.M11_arrow(t, c.arrow1)); S.a2.update(K.M11_arrow(t, c.arrow2));
  },
});
</script>
</body>
</html>
