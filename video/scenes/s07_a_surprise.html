<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 07 · A's surprise</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit/tokens.css">
<script src="../kit/kit.js"></script>
</head>
<body>
<script>
/* Scene 07 · A's most unexpected finding and hand-over to B · docs/video_plan.md §4 scene 07, layout S.
   Speaker A. One relation: of the six hypotheses that were genuinely locked before testing, three were
   supported and three inconclusive. Six neutral squares become feedback shapes (ink only: solid check =
   supported, dashed box with "?" = inconclusive). Never "10 of 17": the six are the pre-registered ones
   (video/data/hypotheses.json, prereg_*). Layout S: the left half (x 0-960) is the camera slot. */

// Cue times in scene seconds, estimated from the §4 narration (replace with the take, §8.3 step 5).
const CUES = {
  six: 2.4,      // "of six hypotheses we locked before testing"   six neutral squares
  three: 5.9,    // "only three were supported"                    squares become shapes; title settles
};

const SQ = { size: 112, gap: 30, x0: 60, y0: [290, 462] };

Kit.createScene({
  number: 7,
  name: 'a_surprise',
  duration: 12,
  layout: 'S',
  speaker: 'A',
  title: [
    { at: 0, text: 'Most unexpected' },
    { at: CUES.three, text: '…' },       // filled from the data in setup()
  ],
  source: '§10 · S10_hypotheses',
  data: '../data/hypotheses.json',
  cues: CUES,

  setup(ctx) {
    const { fig, data, ui } = ctx, K = Kit;
    const S = ctx.S = {};
    const g = K.svg('g', {}, fig);
    const nSup = K.val(data, 'prereg_supported'), nInc = K.val(data, 'prereg_inconclusive'), nAll = K.val(data, 'prereg_n');
    if (nSup + nInc !== nAll) throw new Error('verdict counts do not add up');
    ui.titles[1].el.textContent = K.disp(data, 'prereg_supported') + ' of ' + K.disp(data, 'prereg_n') + ' supported';

    K.text(g, { x: 60, y: 190, text: 'Locked before testing', cls: 'kit-t-note', size: 44 });

    // six squares in two rows of three: row 0 = supported, row 1 = inconclusive
    S.cells = [];
    [[nSup, 'supported'], [nInc, 'inconclusive']].forEach(([n, kind], row) => {
      for (let i = 0; i < n; i++) {
        const x = SQ.x0 + i * (SQ.size + SQ.gap), y = SQ.y0[row];
        const neutral = K.svg('rect', { x: x + 1.5, y: y + 1.5, width: SQ.size - 3, height: SQ.size - 3, rx: 10, fill: '#fff', stroke: K.C.ink, 'stroke-width': 3 }, g);
        const shape = K.feedback(g, { kind, x, y, size: SQ.size });
        S.cells.push({ neutral, shape, row, i });
      }
    });
    S.lab = [
      K.text(g, { x: SQ.x0 + 3 * (SQ.size + SQ.gap) + 14, y: SQ.y0[0] + 72, text: 'supported', cls: 'kit-t-note' }),
      K.text(g, { x: SQ.x0 + 3 * (SQ.size + SQ.gap) + 14, y: SQ.y0[1] + 72, text: 'inconclusive', cls: 'kit-t-note' }),
    ];
  },

  render(t, ctx) {
    const K = Kit, S = ctx.S, c = ctx.cues;
    const flip = K.progress(t, c.three, 0.4, K.ease.morph);
    S.cells.forEach((cl, k) => {
      const a = K.appear(t, c.six + k * 0.1);
      K.op(cl.neutral, a * (1 - flip));
      cl.shape.update(a * flip);
    });
    S.lab.forEach((l) => K.op(l, flip));
  },
});
</script>
</body>
</html>
