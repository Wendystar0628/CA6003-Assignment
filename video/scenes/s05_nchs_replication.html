<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 05 · Replication of official estimates</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit/tokens.css">
<script src="../kit/kit.js"></script>
</head>
<body>
<script>
/* Scene 05 · Replication of official estimates (NCHS Data Brief 516) · docs/video_plan.md §7.1–7.2 scene 05.
   Speaker: member 0. One relation: our survey-weighted total prevalence matches the published one
   (15.79 % vs 15.8 %), with an ink check (supported); 27 published estimates were compared; the largest
   gap is a 24 px footnote. Only the Total row is shown. Numbers: video/data/db516.json. Ink only. */

const CUES = {
  frame: 'NCHS Data Brief',      // table frame: headers and the row name
  ours: '15.79',                 // our value, as it is spoken
  nchs: '15.8',                  // published value
  check: ['15.8', 0.7],          // ink check on the row
  badge: 'all 27',               // "27 published estimates compared"
  foot: ['match closely', 0.3],  // footnote: largest gap
};

const COL = { label: 48, ours: 470, nchs: 830, check: 1150, right: 1240 };
const Y = { head: 110, rule: 140, row: 268, rowRule: 320, badge: 380, foot: 604 };

Kit.createScene({
  number: 5,
  name: 'nchs_replication',
  title: 'Replication of official estimates',
  subtitle: 'Our weighted prevalence beside NCHS Data Brief 516',
  pointer: '4.3',
  data: '../data/db516.json',
  cues: CUES,

  setup(ctx) {
    const { fig, data } = ctx, K = Kit;
    const S = ctx.S = {};
    const g = K.svg('g', {}, fig);
    const total = data.groups.rows.find((r) => r.measure === 'total');

    S.frame = K.svg('g', {}, g);
    K.text(S.frame, { x: COL.ours, y: Y.head, text: 'Ours', cls: 'kit-sans', size: 34, weight: 600 });
    K.text(S.frame, { x: COL.nchs, y: Y.head, text: 'NCHS Data Brief 516', cls: 'kit-sans', size: 34, weight: 600 });
    K.svg('line', { x1: COL.label, x2: COL.right, y1: Y.rule, y2: Y.rule, stroke: K.C.ink, 'stroke-width': 2 }, S.frame);
    K.svg('line', { x1: COL.label, x2: COL.right, y1: Y.rowRule, y2: Y.rowRule, stroke: K.C.line, 'stroke-width': 2 }, S.frame);
    K.text(S.frame, { x: COL.label, y: Y.row - 22, text: 'Diabetes prevalence,', cls: 'kit-t-note' });
    K.text(S.frame, { x: COL.label, y: Y.row + 22, text: 'total (weighted)', cls: 'kit-t-note' });

    S.ours = K.text(g, { x: COL.ours, y: Y.row + 26, text: K.disp(data, total.ours), cls: 'kit-t-second', size: 66 });
    S.nchs = K.text(g, { x: COL.nchs, y: Y.row + 26, text: K.disp(data, total.nchs), cls: 'kit-t-second', size: 66 });
    S.check = K.feedback(g, { kind: 'supported', x: COL.check, y: Y.row - 40, size: 64 });

    S.badge = K.svg('g', {}, g);
    K.svg('rect', { x: COL.label, y: Y.badge, width: 640, height: 76, rx: 8, fill: '#fff', stroke: K.C.ink, 'stroke-width': 2.5 }, S.badge);
    K.text(S.badge, { x: COL.label + 28, y: Y.badge + 50, text: K.disp(data, 'n_estimates') + ' published estimates compared', cls: 'kit-t-note' });
    S.foot = K.text(g, { x: COL.label, y: Y.foot, text: 'Largest absolute gap across the ' + K.disp(data, 'n_estimates') + ' estimates: ' + K.disp(data, 'max_gap'), cls: 'kit-t-foot' });
  },

  render(t, ctx) {
    const K = Kit, S = ctx.S, c = ctx.cues;
    K.op(S.frame, K.appear(t, c.frame));
    K.op(S.ours, K.appear(t, c.ours));
    K.op(S.nchs, K.appear(t, c.nchs));
    S.check.update(K.appear(t, c.check));
    K.op(S.badge, K.appear(t, c.badge));
    K.op(S.foot, K.appear(t, c.foot));
  },
});
</script>
</body>
</html>
